name: CI
on:
  pull_request:
  push:
    branches:
      - master
    tags: '*'

env:
  JULIA_PKG_UNPACK_REGISTRY: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - JSON ${{ matrix.json }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.9'
          - '1.10'
          - '1.11'
        # both supported JSON.jl majors; the resolver alone would only ever pick one
        json:
          - '0.21'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        exclude:
          # JSON 1.x needs julia >= 1.10
          - version: '1.9'
            json: '1'
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install xvfb
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          show-versioninfo: true
      - uses: actions/cache@v6
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - name: Pin JSON ${{ matrix.json }}
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.add(PackageSpec(name="JSON", version="${{ matrix.json }}"))'
      - uses: julia-actions/julia-runtest@latest
